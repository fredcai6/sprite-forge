models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
refs = ["characters/slice-deep/references/current.png"]
template = """Redraw this exact same cartoon pizza character as a SAUCY Chicago DEEP DISH slice, keeping the same pose layout, face, white gloves, black boots, thick dark violet outline and chunky pixel-art game style. The body is a tall thick heavy wedge with a thick golden-brown crust wall around the sides; the top is brimming with a thick layer of chunky glossy red tomato sauce over the cheese, and thick red sauce runs down the sides of the crust wall in long drips, with fat drops hanging at the bottom. No pepperoni. Exactly two arms and two legs. {action} Full body visible from head to feet, no text, flat solid magenta background."""

[shots.idle_a]
prompt = "Idle: standing facing the viewer in three-quarter view, relaxed, arms hanging loose, a mild grumpy look."
[shots.idle_b]
prompt = "Idle: standing, chest lifted a little taller, one hand on the hip, a confident smirk, a fat drop of sauce hanging from the crust."
[shots.idle_c]
prompt = "Idle: standing, exhaling, body slightly lower and relaxed, head tilted, sauce drips sagging."
[shots.jump_rise]
prompt = "Jumping upward: facing right, legs straight and stretched apart, both arms thrown straight up, mouth open in a yell, sauce streaming up and off the top."
[shots.fall]
prompt = "Falling through the air: facing right, knees tucked up, arms out wide, eyes wide, mouth open in surprise, sauce drips flying upward."
[shots.cold_a]
prompt = "Gone cold and stale: whole body pale grey-blue and stiff, the sauce dull dark and congealed, hugging itself with both arms shivering, teeth chattering, hunched, facing right."
[shots.cold_b]
prompt = "Gone cold and stale: pale grey-blue stiff body, congealed dull sauce, hunched over shivering, arms wrapped around itself."
[shots.special_a]
prompt = "Ground pound wind-up: leaping high with both gloved fists clenched together above the head, legs tucked, roaring, sauce splashing off the top."
[shots.special_b]
prompt = "Ground pound landing: crouched hard on the ground with a gloved fist slammed into the floor, roaring, sauce splatters flying out."
