models = ["klein"]
seeds = [1, 2, 3, 4, 5, 6]
width = 2816
height = 720
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"
[shots.far]
prompt = "Wide panoramic background for a late-1990s 2D platformer, hand-painted pixel-art look, soft thin outlines. A ruined post-apocalyptic Naples seascape skyline at warm dusk: a large volcano with a faint orange glow at the crater rising in the distance, hillside of terracotta-roofed houses, the bay with calm water, hazy orange and rose sky, very distant, low contrast, light airy values, minimal detail, no foreground, horizontal panorama. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape."
[shots.mid]
prompt = "Wide side-scrolling platformer background strip, hand-painted pixel-art, bold dark outlines, gritty and funny, warm terracotta, ochre and teal shutter palette: a row of narrow old Italian street buildings with peeling plaster, green and teal shutters, laundry lines with hanging clothes strung across, balconies with potted plants, an old brick pizza oven in an archway, a wrecked small scooter, seen straight-on from the side, all standing on one flat straight cobblestone street line near the bottom. Warm dusk light. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape. Flat solid saturated pure magenta background everywhere above and between the buildings, the sky is plain pure magenta."
[shots.near]
prompt = "Wide side-scrolling platformer foreground strip, hand-painted pixel-art, dark silhouettes: sparse dark foreground clutter along the very bottom edge only: terracotta pots with plants, a stack of crates, a cat silhouette, a bollard, cobblestone rubble, drooping laundry lines and tangled hanging cables at the top edge, large empty space in the middle. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape. Flat solid magenta background everywhere else."
