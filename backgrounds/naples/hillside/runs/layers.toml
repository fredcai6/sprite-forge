models = ["klein"]
seeds = [1, 2, 3, 4, 5, 6]
width = 2816
height = 720
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"
[shots.far]
prompt = "Wide panoramic distant background for a late-1990s 2D platformer, hand-painted pixel-art look, soft thin outlines, pastel pink, peach and turquoise colours. the whole blue bay spreading far below with Vesuvius faintly in the distance and a pastel sunset sky. Very distant, low contrast, light and airy values, minimal fine detail, one slow recognizable landmark, no foreground, horizontal panorama. A living, well-kept, cheerful city: lit windows, awnings, healthy trees, clean streets. Not a ruin: no rubble, no boarded windows, no overgrowth, no fires. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no graffiti lettering. Every sign, flag and billboard is completely blank or shows only a simple abstract shape."
[shots.mid]
prompt = "Wide side-scrolling platformer background, hand-painted pixel-art, bold dark outlines, pastel pink, peach and turquoise palette, cheerful and a little funny: stepped streets climbing a hillside with pastel-coloured houses, balconies with plants and laundry, stone stairways, tiled roofs, lit windows, pink, peach and turquoise palette. Seen straight-on from the side, buildings of varied heights with gaps between them, all standing on one flat straight horizontal street line near the bottom. A living, well-kept, cheerful city: lit windows, awnings, healthy trees, clean streets. Not a ruin: no rubble, no boarded windows, no overgrowth, no fires. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no graffiti lettering. Every sign, flag and billboard is completely blank or shows only a simple abstract shape. Flat solid saturated pure magenta background everywhere above and between the buildings, the sky is plain pure magenta."
[shots.near]
prompt = "Wide side-scrolling platformer background, hand-painted pixel-art, dark soft silhouettes: light foreground framing: potted plants and iron balcony rails and hanging vines at the top. Sparse, with a large empty space in the middle. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no graffiti lettering. Every sign, flag and billboard is completely blank or shows only a simple abstract shape. Flat solid magenta background everywhere else."
