models = ["klein"]
seeds = [1, 2, 3, 4]
width = 768
height = 768
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"
[shots.shot_pepperoni]
prompt = "Hand-painted late-1990s pixel-art game projectile icon: a round red pepperoni disc with darker spots, drawn chunky and large filling most of the picture, seen face-on and slightly tilted as if spinning, very thick near-black outline, bold flat saturated colours, a small bright highlight, simple readable shape at tiny size. No motion lines, no sparkles, no ring, no text. Flat solid magenta background."
