models = ["klein"]
seeds = [1, 2, 3, 4, 5, 6]
width = 2816
height = 720
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"
[shots.far]
prompt = "Wide panoramic background for a late-1990s 2D platformer, hand-painted pixel-art look, soft thin outlines. A post-apocalyptic Long Beach California coast at golden hour: the ocean horizon, distant offshore oil islands with tall derricks, a faded pier, silhouettes of palm trees, low rolling coast hills, warm gold and peach sky fading to turquoise, very distant, low contrast, light airy values, minimal detail, no foreground, horizontal panorama. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape."
[shots.mid]
prompt = "Wide side-scrolling platformer background strip, hand-painted pixel-art, bold dark outlines, gritty and funny, sandy gold, turquoise and coral palette: a row of beachfront scenes: leaning palm trees, a stucco taco-stand style shack with a blank awning, a lifeguard tower, a wrecked old convertible half buried in sand, beach volleyball net, a faded blank billboard, boardwalk railing, seen straight-on from the side, all standing on one flat straight boardwalk line near the bottom. Golden hour light. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape. Flat solid saturated pure magenta background everywhere above and between the buildings, the sky is plain pure magenta."
[shots.near]
prompt = "Wide side-scrolling platformer foreground strip, hand-painted pixel-art, dark silhouettes: sparse dark foreground clutter along the very bottom edge only: spiky beach grass, a beach umbrella, driftwood, a surfboard stuck in the sand, a trash bin, palm fronds and tangled hanging power lines at the top edge, large empty space in the middle. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape. Flat solid magenta background everywhere else."
