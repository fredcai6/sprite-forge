models = ["klein"]
seeds = [1, 2, 3]
width = 2816
height = 720
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"
[shots.far]
prompt = "Wide panoramic background for a late-1990s 2D platformer, hand-painted pixel-art look, bold outlines. A ruined post-apocalyptic New York City skyline at hazy purple and orange sunset, crumbling skyscrapers with broken windows, water towers, a leaning tower with a faded giant pizza slice billboard, smoggy sky, distant tiny details, drifting smoke, a funny cartoon absurd mood. Distant, atmospheric, lower contrast, no foreground, no ground detail, horizontal panorama."
[shots.mid]
prompt = "Wide side-scrolling platformer background strip, hand-painted pixel-art, bold dark outlines, gritty and funny: a row of grungy collapsed New York brownstone storefronts and a pizza shop with a broken neon sign, fire escapes, graffiti, a wrecked yellow taxi sunk in rubble, an overturned hot dog cart, a flickering streetlamp, stuffed garbage bags, seen straight-on from the side, all standing on one flat straight horizontal street line near the bottom. Flat solid magenta background everywhere above and between the buildings, the sky is plain magenta."
[shots.near]
prompt = "Wide side-scrolling platformer foreground strip, hand-painted pixel-art, bold dark outlines, dark silhouettes: sparse dark foreground clutter along the very bottom edge only: tipped garbage cans, a lamppost base, a fire hydrant, steaming manhole, scattered pizza boxes, tangled hanging power lines at the top edge, with large empty space in the middle. Flat solid magenta background everywhere else."
