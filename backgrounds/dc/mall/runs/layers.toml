models = ["klein"]
seeds = [1, 2, 3, 4, 5, 6]
width = 2816
height = 720
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"
[shots.far]
prompt = "Wide panoramic distant background for a late-1990s 2D platformer, hand-painted pixel-art look, soft thin outlines, sky blue and lawn green colours. a small distant white obelisk monument and a small white domed capitol building across a wide open lawn under a big sky. Very distant, low contrast, light and airy values, minimal fine detail, one slow recognizable landmark, no foreground, horizontal panorama. A living, well-kept, cheerful city: lit windows, awnings, healthy trees, clean streets. Not a ruin: no rubble, no boarded windows, no overgrowth, no fires. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no graffiti lettering. Every sign, flag and billboard is completely blank or shows only a simple abstract shape."
[shots.mid]
prompt = "Wide side-scrolling platformer background, hand-painted pixel-art, bold dark outlines, sky blue and lawn green palette, cheerful and a little funny: the National Mall: wide open green lawns, rows of elm trees, a long reflecting pool with still water, gravel paths, low white stone benches, open airy sky, light green and sky blue palette. Seen straight-on from the side, buildings of varied heights with gaps between them, all standing on one flat straight horizontal street line near the bottom. A living, well-kept, cheerful city: lit windows, awnings, healthy trees, clean streets. Not a ruin: no rubble, no boarded windows, no overgrowth, no fires. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no graffiti lettering. Every sign, flag and billboard is completely blank or shows only a simple abstract shape. Flat solid saturated pure magenta background everywhere above and between the buildings, the sky is plain pure magenta."
[shots.near]
prompt = "Wide side-scrolling platformer background, hand-painted pixel-art, dark soft silhouettes: light foreground framing: elm tree trunks and leaves overhanging the top edge and a lamp post. Sparse, with a large empty space in the middle. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no graffiti lettering. Every sign, flag and billboard is completely blank or shows only a simple abstract shape. Flat solid magenta background everywhere else."
