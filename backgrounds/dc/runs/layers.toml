models = ["klein"]
seeds = [1, 2, 3, 4, 5, 6]
width = 2816
height = 720
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"
[shots.far]
prompt = "Wide panoramic background for a late-1990s 2D platformer, hand-painted pixel-art look, soft thin outlines. A ruined post-apocalyptic Washington DC skyline in pale marble and white stone: a tall obelisk monument, a white domed capitol building, a columned memorial, overgrown green trees and vines, hazy pale sky blue to warm cream, very distant, low contrast, light airy values, minimal detail, no foreground, horizontal panorama. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape."
[shots.mid]
prompt = "Wide side-scrolling platformer background strip, hand-painted pixel-art, bold dark outlines, gritty and funny, pale marble cream and sage green palette: a row of grand neoclassical government buildings with columns and steps, cracked and overgrown with vines and weeds, toppled statue pedestal, blank banners, overgrown lawns with hedges, an abandoned filing cabinet pile and paper drifts, bureaucratic ruin, seen straight-on from the side, all standing on one flat straight horizontal street line near the bottom. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape. Flat solid saturated pure magenta background everywhere above and between the buildings, the sky is plain pure magenta."
[shots.near]
prompt = "Wide side-scrolling platformer foreground strip, hand-painted pixel-art, dark silhouettes: sparse dark foreground clutter along the very bottom edge only: tall weeds and grass tufts, a toppled traffic cone, a bench, a park lamppost base, scattered paper sheets, drooping vines and tangled hanging cables at the top edge, large empty space in the middle. There is no text anywhere: no letters, no words, no writing, no logos, no numbers, no labels, no graffiti lettering. Every sign and billboard is completely blank or shows only a simple abstract shape. Flat solid magenta background everywhere else."
