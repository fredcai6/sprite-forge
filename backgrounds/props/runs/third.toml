[shots.box]
prompt = "Hand-painted late-1990s 2D platformer game prop, chunky pixel-art look, bold near-black violet outline, cel shading, warm light from the upper left, deep violet shadows, gritty and a little funny. Flat solid magenta background. An open flat cardboard pizza box seen from steeply above, the lid folded back flat behind the box so only a thin strip of it shows, the box interior is big, empty, plain, flat tan cardboard with no stains, greasy marks only on the outside rim and front, slightly squashed corners. The box fills the picture."
